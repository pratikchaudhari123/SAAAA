services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saaaa
      POSTGRES_USER: saaaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - saaaa_pg:/var/lib/postgresql/data
volumes:
  saaaa_pg:
