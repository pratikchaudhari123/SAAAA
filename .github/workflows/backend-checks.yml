name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saaaa
          POSTGRES_USER: saaaa
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saaaa -d saaaa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: saaaa
      POSTGRES_USER: saaaa
      POSTGRES_PASSWORD: ci-ephemeral-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - name: Validate fresh evaluation database schema
        run: |
          python manage.py makemigrations campus
          python manage.py makemigrations --check --dry-run
          python manage.py migrate
      - run: python manage.py test campus
