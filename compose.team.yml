# Isolated fresh-clone evaluation only. Do not use against existing institutional DBs.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: saaaa
      POSTGRES_USER: saaaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - team_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saaaa -d saaaa"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.team
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: saaaa
      POSTGRES_USER: saaaa
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py runserver 0.0.0.0:8000 --noreload
volumes:
  team_db:
